// Mod Publish Plugin settings — for hand-written (NON-MCreator) Gradle projects.
// For MCreator mods use the yukleyici/ folder instead (MCreator overwrites build.gradle).
// Docs: https://modmuss50.github.io/mod-publish-plugin/
// Note: plugin 2.x needs Gradle 9+. With older Gradle use '1.1.0'.

// WARNING: add the plugin line INSIDE the EXISTING plugins { } block of build.gradle,
// do not open a second plugins block. This file can't be used with 'apply from:', paste it by hand.
plugins {
    // ...existing plugins...
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

publishMods {
    def changelogDosyasi = project.file('changelog.txt')
    def tokenlar = ['CURSEFORGE_TOKEN', 'MODRINTH_TOKEN', 'GITHUB_TOKEN']

    file = jar.archiveFile
    displayName = "${mod_name} ${mod_version}"
    version = mod_version
    changelog = changelogDosyasi.exists() && changelogDosyasi.text.trim() ? changelogDosyasi.text : "${mod_name} ${mod_version}"
    type = mod_version.contains('alpha') ? ALPHA : mod_version.contains('beta') ? BETA : STABLE
    modLoaders.add('neoforge')

    // -PdryRun verilirse ya da tokenlardan BİRİ bile eksikse hiçbir şey yüklemez, sadece prova yapar
    dryRun = providers.gradleProperty('dryRun').isPresent() ||
             tokenlar.any { providers.environmentVariable(it).getOrNull() == null }

    curseforge {
        projectId = '000000'            // CurseForge proje ID'n
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        // requires('slug')  // bağımlılık örneği
    }
    modrinth {
        projectId = 'XXXXXXXX'          // Modrinth proje ID'n
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        // requires('slug')  // bağımlılık örneği
    }
    github {
        repository = 'KULLANICI/REPO'
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = 'main'
        tagName = "v${mod_version}"
    }
}
